name: Deploy Pages
on:
  push:
    branches: ["main"]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.pages-deploy.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - name: Patch
        env:
          A8DE60: ${{ secrets.A8DE60 }}
          BBB554: ${{ secrets.BBB554 }}
        run: |
          python3 -c "
          import sys, pathlib, os
          meta_a = os.environ.get('A8DE60', '')
          meta_b = os.environ.get('BBB554', '')
          page = pathlib.Path('index.html')
          src = page.read_text(encoding='utf-8')
          out = src
          if meta_a:
              out = out.replace('<!-- 205b5e4fa7bfa97d90501d -->', meta_a)
          if meta_b:
              out = out.replace('<!-- 9178c115fd64f4573ea759fc8d10e8 -->', meta_b)
          if out == src and (meta_a or meta_b):
              sys.exit(1)
          if out != src:
              page.write_text(out, encoding='utf-8')
          "
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - id: pages-deploy
        uses: actions/deploy-pages@v4
